name: docs

on:
  # Deploy on a stable release, so the site documents what PyPI serves rather
  # than unreleased work on main. Pre-releases build but do not deploy.
  release:
    types: [published]
  # Deploy by hand, e.g. for a docs fix between releases.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --group docs --locked
      - run: uv run just docs
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.release.prerelease }}
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
