name: Publish to PyPI

# Publishing workflow with three trigger modes:
#
# 1. Publish to TestPyPI (verify before a full release):
#      just tag
#    which tags the version in pyproject.toml and pushes the tag.
#
# 2. Publish to PyPI:
#      just release
#    or create a GitHub Release for that tag on github.com. A version such as
#    0.2.0rc1 is a pre-release: PyPI serves it only to those who ask for it,
#    and the docs workflow does not deploy it. `just release` marks it as one
#    on GitHub; on github.com, tick "Set as a pre-release".
#
# 3. Manual publish (Actions tab -> "Publish to PyPI" -> "Run workflow"):
#    Choose 'testpypi' or 'pypi' from the dropdown. Defaults to testpypi.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  pypi-publish:
    name: Upload release to ${{ github.event_name == 'push' && 'testpypi' || inputs.target || 'pypi' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'testpypi' || inputs.target || 'pypi' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv build
      - run: uv publish ${{ (github.event_name == 'push' || inputs.target == 'testpypi') && '--publish-url https://test.pypi.org/legacy/' || '' }}
