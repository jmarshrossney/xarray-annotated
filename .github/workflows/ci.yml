name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --group dev --locked # note: dev includes rust-just - prev line is superfluous
      - run: uv run just lint-check
      - run: uv run just typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --locked
      - run: uv run just test-cov

  smoke:
    # Install the built wheel rather than the source tree, so a file missing
    # from the wheel fails here instead of after a release. `uv build` builds
    # the wheel from the sdist, so this covers both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import xarray_annotated"
