[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[project]
name = "xarray-annotated"
version = "0.6.0"
description = "Run-time validation of xarray DataArray structure, units and frequency, declared via typing.Annotated"
authors = [
    { name = "jmarshrossney", email = "17361029+jmarshrossney@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pint>=0.25.3",
    "pint-xarray>=0.6.1",
    "xarray>=2026.2.0",
]
keywords = ["xarray", "pint", "units", "validation", "annotations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
cf = ["cf-xarray>=0.11.3"]

[project.urls]
Homepage = "https://jmarshrossney.github.io/xarray-annotated"
Repository = "https://github.com/jmarshrossney/xarray-annotated"
Documentation = "https://jmarshrossney.github.io/xarray-annotated"

[dependency-groups]
dev = [
    "xarray-annotated[cf]",
    "cftime>=1.6",
    "coverage>=7.13.5",
    "pyright>=1.1.409",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.4",
    "rust-just>=1.46.0",
    "pre-commit>=4.6.0",
    {include-group = "docs"},
    {include-group = "integrations"},
]
# Third-party libraries xarray-annotated *composes with* but never imports.  These are
# test-only: there is nothing for a user to install to "enable" the integration, so this
# is deliberately a dependency group and not an optional-dependency extra (contrast
# `cf`, which is an extra because `units._registry` really does import cf_xarray).
# `tests/test_jaxtyping.py` skips itself when they are absent.
integrations = [
    "beartype>=0.22.9",
    "jaxtyping>=0.3.11",
]
docs = [
    "marimo>=0.23.11",
    "marimo-md-export>=0.7.0",
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.46",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/", "tests/"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# Ruff broadened its default rule set in 0.16, so always select explicitly:
# that way a version bump cannot change which rules apply.
select = [
    "E",   # pycodestyle errors
    "D",   # pydocstyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
    "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
# Exempt tests from docstring requirements. B008 (function call in an argument
# default) is exempted because several tests exist precisely to check that a
# parameter left at its default is still converted/validated -- the call in the
# default is the fixture under test, not an oversight.
"tests/**" = ["B008", "D", "E501"]
# marimo threads `Annotated` in as a cell argument, so ruff can't resolve it to
# `typing.Annotated` and misreads the unit strings in the metadata as forward
# references (F821 "undefined name" / F722 "syntax error in forward annotation").
# The rest are generic to marimo notebooks, which are generated dataflow
# descriptions rather than hand-written modules:
#   B018    a bare trailing expression IS the cell's output mechanism.
#   E501    long prose/URLs inside mo.md() cannot be rewrapped by ruff format,
#           and a `# noqa` after the closing quotes flip-flops forever
#           (marimo strips the two spaces, ruff format restores them).
#   D100    notebooks are not modules and have no module docstring.
#   D103    cell functions are machine-generated and undocumented.
#   F841    exploratory cells leave unused variables around.
#   RUF001  prose contains en dashes; RUF003 contains Greek letters.
"examples/**" = [
    "B018",
    "D100",
    "D103",
    "E501",
    "F722",
    "F821",
    "F841",
    "RUF001",
    "RUF003",
    # Pre-emptive, and only active if "PL" is ever added to select above:
    #   PLR1711 ruff deletes the bare `return` that ends every cell and
    #           `marimo check --fix` re-adds it -- an infinite flip-flop.
    #   PLC0415 notebook imports live inside cells by design.
    "PLR1711",
    "PLC0415",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { marimo-md-export = false }
